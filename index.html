<script>
const M={"idle": {"n": 8, "cols": 4, "cw": 225, "ch": 260, "ax": 72, "fy": 256}, "walk": {"n": 35, "cols": 6, "cw": 182, "ch": 240, "ax": 87, "fy": 236}, "run": {"n": 12, "cols": 4, "cw": 332, "ch": 256, "ax": 156, "fy": 252}, "jump": {"n": 10, "cols": 5, "cw": 236, "ch": 255, "ax": 125, "fy": 251}, "wolf_run": {"n": 8, "cols": 4, "cw": 237, "ch": 257, "ax": 118, "fy": 253}, "wolf_fall": {"n": 4, "cols": 4, "cw": 237, "ch": 435, "ax": 118, "fy": 431}, "wolf_sleep": [240, 124], "thorn": [220, 100], "firefly": {"n": 4, "cols": 4, "cw": 56, "ch": 98, "ax": 28, "fy": 94}, "log": [400, 183], "ledge": [340, 201], "stump": [220, 186], "p_mush": [130, 121], "p_grass": [150, 82], "p_fern": [190, 128], "p_vine": [130, 187], "p_rock": [170, 112], "p_sign": [110, 151], "tree": [640, 392, 294.7166799680766, 351.4126097366321], "ground_surface": 325, "lantern_ui": [350, 300], "ravine_l": [560, 688, 548, 12], "ravine_r": [530, 688, 0, 6]},A='assets/',IM={},VH=450,GY=340,SP=.5,$=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),oc=document.createElement('canvas'),ox=oc.getContext('2d');

const LV={len:7600,start:300,door:7300,

/* ---------- State ---------- */
let S=1,VW=800,st='load',g,L=1,camX=0,T=0,inv=0,flash=0,spk=[],fl=[],wv=[],tree=0,msg='',mt=0,tipI=0,endT=0,props=[];

function rs(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;oc.width=cv.width;oc.height=cv.height;S=cv.height/VH;VW=cv.width/S}addEventListener('resize',rs);rs();
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mkProps(){const r=rng(7),k=['p_mush','p_grass','p_fern','p_rock','p_grass','p_sign'];props=[];for(let x=120;x<LV.len;x+=170+r()*190){if(LV.gap.some(([a,b])=>x>a-300&&x<b+300)||LV.thorn.some(t=>Math.abs(x-t)<90))continue;props.push({x,n:k[Math.floor(r()*k.length)]})}LV.gap.forEach(([a])=>props.push({x:a-310,n:'p_sign'}))}
function newGame(){L=1;g={x:LV.start,y:GY,vx:0,vy:0,on:true,f:1,ht:0,hd:0,coy:0,jb:0,dist:0,land:0,a:1};camX=0;inv=0;flash=0;spk=[];fl=LV.ff.map(([x,h],i)=>({x,h,got:0,ph:i*1.7}));wv=LV.wolf.map(x=>({x,s:'sleep',t:0,vy:0,fy:0}));inp.l=inp.r=inp.j=0;tree=0;tipI=0;msg='';mt=0;mkProps();clearHint()}
function clearHint(){}
function show(){const p=st==='play'||st==='pause'||st==='enter';['bl','br','bj','bp'].forEach(i=>$(i).style.display=p?'block':'none');$('title').style.display=st==='title'?'flex':'none';$('end').style.display=(st==='win'||st==='lose'||st==='pause')?'flex':'none'}
/* ---------- Sound: a playful, teasing tune that gets tense as the light fades ---------- */
let AC,bus,mst,nxt=0,n16=0;const mf=m=>440*Math.pow(2,(m-69)/12),SCL=[0,1,3,5,6,8,10];
function initAudio(){if(AC){AC.resume();return}AC=new(window.AudioContext||window.webkitAudioContext)();mst=AC.createGain();mst.gain.value=.5;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;bus=AC.createGain();const d=AC.createDelay();d.delayTime.value=.27;const fb=AC.createGain();fb.gain.value=.3;d.connect(fb);fb.connect(d);bus.connect(lp);lp.connect(mst);lp.connect(d);d.connect(mst);mst.connect(AC.destination);nxt=AC.currentTime+.1;setInterval(sched,90)}
function nt(m,t,d,ty,v,at=.005){const o=AC.createOscillator(),q=AC.createGain();o.type=ty;o.frequency.value=mf(m);q.gain.setValueAtTime(0,t);q.gain.linearRampToValueAtTime(v,t+at);q.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(q);q.connect(bus);o.start(t);o.stop(t+d+.05)}

function sched(){if(!AC||st==='load'||st==='pause')return;const ten=st==='play'?1-L:.2,spb=60/(100+ten*34)/4;
 while(nxt<AC.currentTime+.3){const s=n16%16,bar=Math.floor(n16/16)%4,root=[45,45,41,43][bar];
  if(s%4===0)nt(root,nxt,spb*3.5,'triangle',.16);if(s===0||s===10)nt(33,nxt,.18,'sine',.3,.002);
  if(s%2===0&&(s+bar)%3!==1)nt(root+24+SCL[(s/2+bar*2+(Math.random()<.3?1:0))%7]-((s>>3)&1?0:12),nxt,spb*1.6,'square',.045);
  if(s===14&&Math.random()<.5)[0,-1,-2].forEach((k,i)=>nt(root+31+k,nxt+i*spb*.5,spb*.6,'triangle',.07));
  if(ten>.6&&s%8===4)nt(root+6,nxt,spb*3,'sawtooth',.03*ten);nxt+=spb;n16++}}
function sfx(k){if(!AC)return;const t=AC.currentTime;
 if(k==='chime')[76,83,88,95].forEach((m,i)=>nt(m,t+i*.06,.5,'sine',.12));else if(k==='jump')glide(300,520,.18,'sine',.1);else if(k==='hurt')glide(220,70,.35,'sawtooth',.12);
 else if(k==='growl')glide(120,60,.6,'sawtooth',.14);else if(k==='fall')glide(500,80,.9,'triangle',.12);
 else if(k==='win')[72,76,79,84,88].forEach((m,i)=>nt(m,t+i*.15,.9,'triangle',.14));else if(k==='lose')[57,54,51,45].forEach((m,i)=>nt(m,t+i*.3,1,'sawtooth',.08))}
/* ---------- Update ---------- */
function hurt(a){L-=a;flash=.3;inv=1.2;sfx('hurt');if(L<=0)endGame(false)}
function upd(dt){T+=dt;const P=g;inv-=dt;flash-=dt;P.land-=dt;mt-=dt;

  const tg=dir*(st==='enter'?90:(P.ht>.22?250:150)),ac=P.on?1100:520;if(P.on||Math.abs(tg)>Math.abs(P.vx)||Math.sign(tg)!==Math.sign(P.vx))P.vx+=Math.max(-ac*dt,Math.min(ac*dt,tg-P.vx));if(P.vx>5)P.f=1;else if(P.vx<-5)P.f=-1;
  P.coy=P.on?.1:P.coy-dt;P.jb-=dt;if(inp.j){P.jb=.13;inp.j=0}
  if(st==='play'&&P.jb>0&&P.coy>0){P.vy=-440;P.on=false;P.coy=0;P.jb=0;P.vx=Math.max(-300,Math.min(300,P.vx*1.25));sfx('jump')}
  const py=P.y;P.vy+=900*dt;P.x=Math.max(80,P.x+P.vx*dt);P.y+=P.vy*dt;P.dist+=Math.abs(P.vx*dt);
  let fy=inGap(P.x)?null:GY;for(const[lx,h]of LV.ledge){const ly=GY-h;if(Math.abs(P.x-lx)<78&&py<=ly+2&&P.y>=ly&&P.vy>=0&&(fy===null||ly<fy))fy=ly}

  if(P.y>GY+140){const gp=LV.gap.find(([a,b])=>P.x>a&&P.x<b);P.x=gp?gp[0]-70:P.x;P.y=GY;P.vy=0;P.vx=0;inv=1.5;L-=.12;sfx('fall');if(L<=0)endGame(false)}
  if(st==='play'){L-=DIM*Math.abs(P.vx*dt)+.002*dt;const lx=P.x+P.f*30,ly=P.y-52;
   for(const f of fl){if(f.got)continue;if(Math.hypot(lx-f.x,ly-(GY-f.h))<40){f.got=1;L=1;sfx('chime');for(let i=0;i<26;i++){const a=Math.random()*6.28,v=40+Math.random()*120;spk.push({x:f.x,y:GY-f.h,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1})}}}
   for(const x of LV.thorn)if(inv<=0&&Math.abs(P.x-x)<46&&P.y>GY-26){hurt(.25);P.vx=-P.f*160;P.vy=-200;P.on=false}
   for(const w of wv){
    if(w.s==='sleep'&&Math.abs(P.x-w.x)<50&&P.y>GY-40){w.s='chase';w.t=0;sfx('growl');msg='RUN! Hold the arrow and leap the ravine!';mt=4}
    else if(w.s==='chase'){w.t+=dt;if(w.t>1)w.x+=Math.sign(P.x-w.x)*165*dt;if(inGap(w.x)){w.s='fall';w.t=0;w.vy=0;w.fy=0;sfx('fall')}
     else if(w.t>1&&inv<=0&&Math.abs(P.x-w.x)<48&&P.y>GY-30){hurt(.2);P.vx=P.f*260;P.vy=-180;P.on=false}}
    else if(w.s==='fall'){w.t+=dt;w.vy+=1100*dt;w.fy+=w.vy*dt;if(w.fy>520)w.s='gone'}}
   if(L<=0)return;if(P.x>=LV.door-8&&P.on){st='enter';endT=0;sfx('win');tree=1;show()}
   if(tipI<LV.tips.length&&P.x>=LV.tips[tipI][0]){msg=LV.tips[tipI][1];mt=5;tipI++}}
  if(st==='enter'){endT+=dt;if(P.x>=LV.door-2){P.vx=0;P.a=Math.max(0,P.a-dt*1.6)}if(endT>2){endGame(true)}}}
 for(const s of spk){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=40*dt;s.l-=dt*1.2}spk=spk.filter(s=>s.l>0);
 camX+=(Math.max(0,Math.min(LV.len-VW+150,g.x-VW*.36))-camX)*Math.min(1,dt*6)}
function endGame(w){if(st==='win'||st==='lose')return;st=w?'win':'lose';sfx(w?'win':'lose');$('plq').style.backgroundImage='url(assets/'+(w?'plaque_win':'plaque_lose')+'.webp)';

function btn(el,img,fn){el.style.backgroundImage='url(assets/'+img+'.webp)';el.onclick=fn;el.style.display='block'}
/* ---------- Drawing ---------- */
function spr(im,m,i,x,fy,flip,al){const sx=(i%m.cols)*m.cw,sy=Math.floor(i/m.cols)*m.ch;ctx.save();ctx.translate(x,0);ctx.scale(flip<0?-1:1,1);if(al!==undefined)ctx.globalAlpha=al;ctx.drawImage(im,sx,sy,m.cw,m.ch,-m.ax*SP,fy-m.fy*SP,m.cw*SP,m.ch*SP);ctx.restore()}
function lay(im,par,k,yb,al){if(!im.width)return;const w=im.width*k,h=im.height*k,o=-(((camX*par)%w)+w)%w;ctx.globalAlpha=al||1;for(let x=o;x<VW;x+=w)ctx.drawImage(im,x,yb-h,w+.6,h);ctx.globalAlpha=1}
function ground(){const im=IM.ground,kg=.55,tw=im.width*kg,y0=GY-M.ground_surface*kg;let sg=[[camX-10,camX+VW+10]];
 LV.gap.forEach(([a,b])=>{sg=sg.flatMap(([s,e])=>a>=e||b<=s?[[s,e]]:[[s,a],[b,e]].filter(q=>q[1]>q[0]))});

  for(let i=0;i<5;i++){const x=a-camX+(b-a)*i/4,y=GY+24+Math.sin(T*1.3+i*2)*10,r=ctx.createRadialGradient(x,y,0,x,y,46);r.addColorStop(0,'rgba(110,120,200,.55)');r.addColorStop(1,'rgba(110,120,200,0)');ctx.fillStyle=r;ctx.fillRect(x-60,y-60,120,120)}}}
const RV={};function mkRav(){for(const k of['l','r']){const im=IM['ravine_'+k],c=document.createElement('canvas');if(!im.width)continue;c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);x.globalCompositeOperation='destination-in';const gr=x.createLinearGradient(0,0,im.width,0);if(k==='l'){gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.25,'rgba(0,0,0,1)')}else{gr.addColorStop(.75,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)')}x.fillStyle=gr;x.fillRect(0,0,im.width,im.height);RV[k]=c}}
function ravines(){if(!RV.l)return;const ml=M.ravine_l,mr=M.ravine_r;for(const[a,b]of LV.gap){if(b+300<camX||a-300>camX+VW)continue;ctx.drawImage(RV.l,a-camX-ml[2]*SP,GY-ml[3]*SP+2,ml[0]*SP,ml[1]*SP);ctx.drawImage(RV.r,b-camX-mr[2]*SP,GY-mr[3]*SP+2,mr[0]*SP,mr[1]*SP)}}
function draw(){ctx.setTransform(S,0,0,S,0,0);ctx.clearRect(0,0,VW,VH);const sk=IM.sky,ks=Math.max(VW/sk.width,VH/sk.height);if(sk.width)ctx.drawImage(sk,(VW-sk.width*ks)/2,(VH-sk.height*ks)/2,sk.width*ks,sk.height*ks);
 lay(IM.far,.1,.62,GY+30,.9);lay(IM.mid,.28,.62,GY+40);lay(IM.near,.55,.62,GY+60,.95);ground();
 for(const p of props){const im=IM[p.n],m=M[p.n];if(!m)continue;const x=p.x-camX;if(x<-100||x>VW+100)continue;ctx.drawImage(im,x-m[0]*SP/2,GY+6-m[1]*SP,m[0]*SP,m[1]*SP)}
 {const t=IM.tree,to=tree?IM.tree_open:t,w=M.tree[0]*.8,h=M.tree[1]*.8,x=LV.door-camX-M.tree[2]*.8,y=GY-M.tree[3]*.8+2;if(x<VW+300)ctx.drawImage(to,x,y,w,h)}

 for(const[lx,h]of LV.ledge){const w=M.ledge[0]*SP,hh=M.ledge[1]*SP;ctx.drawImage(IM.ledge,lx-camX-w/2,GY-h-hh*.18,w,hh)}

 {const P=g,x=P.x-camX;let im,m,i;const spd=Math.abs(P.vx);
  if(!P.on){im=IM.girl_jump;m=M.jump;const v=P.vy;i=v<-300?1:v<-120?2:v<-30?3:v<60?4:v<180?5:v<300?6:7}
